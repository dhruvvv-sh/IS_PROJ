[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherchat"
version = "0.2.0"
description = "Attack-aware end-to-end encrypted messaging educational prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "mysql-connector-python>=9.5,<10",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
