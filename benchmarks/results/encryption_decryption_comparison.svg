<text x="1225.8" y="574" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15243a">300.0</text>
<rect x="875" y="596" width="120.1" height="28" rx="4" fill="#2766b0"/>
<text x="1003.1" y="616" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15243a">105.1</text>
<rect x="42" y="737" width="1276" height="76" rx="12" fill="#edf7f1"/>
<text x="62" y="768" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#145d38">16 KiB finding: CipherChat encrypts faster (210.1 vs 305.5 µs).</text>
<text x="62" y="795" font-family="Arial,sans-serif" font-size="17" fill="#24445a">Olm still completes encrypt + decrypt faster (410.9 vs 510.8 µs).</text>
